root: "../../out"
schema_version: 1

dataset:
  name: "rifter_civici"
  source_id: "comune_bologna_opendata"
  tags: [territorio, civici, toponomastica, quartiere, zona, area-statistica, bologna]
  category: territorio
  years: [2026]

raw:
  output_policy: overwrite
  sources:
    - name: "ods_rifter_civici"
      type: "http_file"
      args:
        url: "https://opendata.comune.bologna.it/api/explore/v2.1/catalog/datasets/rifter_civici_pt/exports/parquet"
        filename: "rifter_civici.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
  required_columns:
    - anno_run
    - civkey
    - id_civ
    - partkey
    - codvia
    - civico
    - subciv
    - ncivsub
    - indirizzo_completo
    - via
    - cap
    - quartiere
    - zona_codice
    - zona
    - area_statistica
    - cod_area_statistica
    - zona_prossimita
    - centro_storico
    - localita_istat
    - cod_localita_istat
    - sezione_istat
    - sez_2011
    - sez_2001
    - sez_1991
    - sez_1981
    - bacino_scuola
    - bacino_scuola_0
    - bacino_scuola_1
    - codfab
    - codarco
    - codice_ann
    - codice_ans
    - data_istituzione
    - data_variazione
    - lat
    - lon
    - geo_shape
    - x_utm
    - y_utm
  validate:
    min_rows: 70000
    not_null: [civkey, quartiere, zona]
    primary_key: [civkey]

mart:
  tables:
    - name: "mart_zona_civici"
      sql: "sql/mart_zona_civici.sql"
  required_tables:
    - "mart_zona_civici"
  validate:
    table_rules:
      mart_zona_civici:
        required_columns: [quartiere, zona, civici, vie]
        primary_key: [quartiere, zona]
        min_rows: 6

validation:
  fail_on_error: true
