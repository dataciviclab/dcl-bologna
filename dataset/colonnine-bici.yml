# Dataset: Colonnine conta-bici — passaggi orari
# Fonte: OpenData Comune di Bologna — Settore Mobilità Sostenibile
# API Opendatasoft v2.1 — export diretto Parquet
# ============================================================

dataset:
  id: colonnine-bici
  title: "Colonnine conta-bici — passaggi orari"
  description: >
    Conteggio orario dei passaggi di biciclette rilevati dalle colonnine
    di rilevamento in varie postazioni a Bologna.
    Ogni riga è una lettura oraria per colonnina.
    Include direzione centro e periferia e totale.

source:
  type: opendatasoft
  base_url: "https://opendata.comune.bologna.it/api/explore/v2.1"
  dataset_id: "colonnine-conta-bici"
  export_format: parquet

schema:
  columns:
    - name: data
      type: datetime
      description: Data e ora della rilevazione (oraria)
    - name: direzione_centro
      type: int
      description: Bici in direzione centro
    - name: direzione_periferia
      type: int
      description: Bici in direzione periferia
    - name: totale
      type: int
      description: Totale bici rilevate (centro + periferia)
    - name: colonnina
      type: string
      description: Nome della postazione di rilevamento
    - name: geo_point_2d
      type: struct
      description: Coordinate geografiche (lon, lat)

coverage:
  years: "2026 (almeno febbraio–luglio)"
  territorial: "Bologna — postazioni di rilevamento"
  granularity: "oraria × postazione × direzione"
  records: 516200

schedule:
  frequency: monthly
  note: "Aggiornato mensilmente dal Settore Mobilità"

usage:
  example: |
    -- Bici totali per colonnina
    SELECT colonnina, sum(totale) as passaggi
    FROM data
    GROUP BY colonnina
    ORDER BY passaggi DESC
  example2: |
    -- Media giornaliera per ora
    SELECT extract(hour FROM data) as ora, avg(totale) as media
    FROM data
    GROUP BY ora ORDER BY ora
