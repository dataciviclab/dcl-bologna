# Dataset: Emigrati per destinazione — serie storica
# Fonte: OpenData Comune di Bologna — Ufficio Comunale di Statistica
# API Opendatasoft v2.1 — export diretto Parquet
# ============================================================

dataset:
  id: emigrati-destinazione
  title: "Emigrati secondo la destinazione, per sesso, quartiere e zona di provenienza"
  description: >
    Serie storica dal 1986 degli emigrati dal Comune di Bologna per
    destinazione, disaggregati per sesso, quartiere e zona di provenienza.
    Completa il ritratto demografico dei quartieri con il saldo migratorio.

source:
  type: opendatasoft
  base_url: "https://opendata.comune.bologna.it/api/explore/v2.1"
  dataset_id: emigrati-secondo-la-destinazione-per-sesso-quartiere-e-zona-di-provenienza-serie
  export_format: parquet

schema:
  columns:
    - name: anno
      type: date
      description: Anno di riferimento (1986–2024)
    - name: destinazione_comuni_e_aree_italia
      type: string
      description: Destinazione — comuni e aree d'Italia
    - name: destinazione_comuni_regioni
      type: string
      description: Destinazione — regione
    - name: numero_emigrati
      type: int
      description: Numero emigrati
    - name: quartiere
      type: string
      description: Quartiere di provenienza
    - name: sesso
      type: string
      description: Maschi / Femmine
    - name: zona
      type: string
      description: Zona statistica

coverage:
  years: "1986–2024"
  territorial: "Comune di Bologna — quartieri e zone"
  granularity: "destinazione × sesso × quartiere × zona"
  records: 81806

schedule:
  frequency: annual
  note: "Aggiornato ogni anno dall'Ufficio Statistica (dato al 31/12)"

usage:
  example: |
    -- Emigrati per quartiere di provenienza (2024)
    SELECT quartiere, sum(emigrati) as emigrati
    FROM data
    WHERE anno = (SELECT max(anno) FROM data)
    GROUP BY quartiere
    ORDER BY emigrati DESC

cross_lab:
  - dataset: popolazione-quartiere
    key: anno × quartiere × zona
