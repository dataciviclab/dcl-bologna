# Dataset: Incarichi di collaborazione e consulenza
# Fonte: OpenData Comune di Bologna — Amministrazione Trasparente
# ============================================================

dataset:
  id: incarichi
  title: "Incarichi di collaborazione e consulenza"
  description: >
    Incarichi di collaborazione, consulenza e difesa in giudizio
    conferiti dal Comune di Bologna a soggetti esterni.
    Aggiornato settimanalmente. Dati dal 2012.
    Cross-Lab: partita_iva / ragione_sociale → ANAC.

source:
  type: opendatasoft
  base_url: "https://opendata.comune.bologna.it/api/explore/v2.1"
  dataset_id: "incarichi-di-collaborazione"
  export_format: parquet

coverage:
  years: "2012–2026"
  records: 747
  territorial: "Comune di Bologna"
  granularity: "singolo incarico"

schedule:
  frequency: weekly
