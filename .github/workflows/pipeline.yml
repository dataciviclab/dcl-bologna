# Pipeline — dcl-bologna
#
# Run post-merge + schedule. Fa tutto:
#   1. bootstrap varchi-ztl (fetch 80 varchi + merge) con cache persistente
#   2. run dei dataset (cambiati se PR merged, TUTTI se schedule/manuale)
#   3. sync GCS (clean + mart) — GRACEFUL: skippata se le chiavi non ci sono
#   4. `toolkit registry build --write` → PR draft se diff (pattern eurostat/DI)
#
# Triggers:
#   - pull_request closed (merged) su datasets/** → run dei dataset cambiati
#   - schedule mensile (1° del mese 06:00 UTC) → run completo (refresh dati)
#   - workflow_dispatch → manuale, slug opzionale

name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      datasets:
        description: "Dataset slugs (comma-separated) o vuoto per tutti"
        required: false
        type: string
      smoke:
        description: "Smoke mode (--sample-rows 1000, skips GCS sync)"
        required: false
        default: false
        type: boolean

concurrency:
  group: dcl-bologna-pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

env:
  TOOLKIT_ALLOW_SCRIPT_SOURCE: "1"

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolkit
        run: |
          pip install git+https://github.com/dataciviclab/toolkit.git
          pip install git+https://github.com/dataciviclab/lab-connectors.git

      # ── Determinare i dataset da processare ─────────────────────────
      - name: Detect datasets to run
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_DATASETS: ${{ inputs.datasets }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # PR merged: solo i dataset cambiati
            gh pr view "$PR_NUMBER" --json files --jq ".files[].path" | \
              grep '^datasets/' | cut -d/ -f2 | sort -u > dirs.txt
          elif [ -n "$INPUT_DATASETS" ]; then
            echo "$INPUT_DATASETS" | tr ',' '\n' | sed 's/_/-/g' > dirs.txt
          else
            # Schedule/manuale senza slug: tutti
            find datasets -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort > dirs.txt
          fi
          DIRS=""
          while read -r d; do
            [ -n "$d" ] && [ -f "datasets/$d/dataset.yml" ] && DIRS="$DIRS datasets/$d"
          done < dirs.txt
          if [ -n "$DIRS" ]; then
            echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          else
            echo "dirs=" >> "$GITHUB_OUTPUT"
          fi

      # ── Bootstrap varchi-ztl (SOLO se varchi è tra i dataset processati) ──
      # I 80 varchi raw stanno in una cache persistente (actions/cache):
      # al primo run si scaricano (~20-25 min), ai successivi solo il merge.
      # La key è basata sullo script di fetch: lo script --fetch è
      # incrementale, quindi i nuovi varchi dall'API vengono scaricati comunque.
      - name: Cache varchi raw
        if: contains(steps.detect.outputs.dirs, 'varchi-ztl')
        uses: actions/cache@v4
        with:
          path: datasets/varchi-ztl/cache/
          key: varchi-cache-${{ hashFiles('datasets/varchi-ztl/fetch_varchi_toolkit.py') }}
          restore-keys: |
            varchi-cache-

      - name: Bootstrap varchi-ztl
        if: contains(steps.detect.outputs.dirs, 'varchi-ztl')
        run: |
          # Fallisce se il mergiato non viene prodotto (es. API ODS down):
          # meglio un errore chiaro che un run con dati stale.
          python datasets/varchi-ztl/fetch_varchi_toolkit.py --fetch

      # ── Run pipeline ─────────────────────────────────────────────────
      - name: Run datasets
        if: steps.detect.outputs.dirs != ''
        env:
          SMOKE: ${{ inputs.smoke && '--sample-rows 1000' || '' }}
        run: |
          YEAR=$(date +%Y)
          for dir in ${{ steps.detect.outputs.dirs }}; do
            echo "=== $dir ==="
            toolkit run -c "$dir/dataset.yml" --years $YEAR $SMOKE
          done

      # ── Sync GCS (placeholder D3: pubblicazione non ancora attiva) ──
      # Lo step è strutturato per auth + sync (pattern eurostat), ma la
      # pubblicazione vera non è decisa (D3). Con o senza chiavi fa solo
      # echo — da implementare quando si attiva la pubblicazione GCS.
      - name: Sync GCS (clean+mart)
        if: ${{ !inputs.smoke }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_DCL_BOLOGNA }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "⚠️ GCP_SA_KEY_DCL_BOLOGNA non configurata — skip GCS sync (D3)"
          else
            echo "✅ GCP auth disponibile — GCS sync da implementare (D3: pubblicazione non attiva)"
          fi

      # ── Registry + PR draft (pattern eurostat/DI) ─────────────────────
      # Escluso in smoke: il builder vedrebbe parquet sample (1000 righe)
      # e produrrebbe un catalogo basato su dati parziali.
      - name: Build registry
        if: ${{ !inputs.smoke }}
        run: toolkit registry build --write

      - name: Check registry diff
        if: ${{ !inputs.smoke }}
        id: diff
        run: |
          # registry/ è untracked su main (generato dal builder) —
          # git diff ignora gli untracked, quindi usiamo git status.
          if git status --porcelain -- registry/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft registry PR
        if: ${{ !inputs.smoke && steps.diff.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'schedule' }}
        run: |
          BRANCH="post-merge-registry/${PR_NUMBER}-registry"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add registry/
          git commit -m "chore(post-merge): aggiorna registry ($PR_NUMBER)" || exit 0
          git push --force-with-lease -u origin "$BRANCH"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --title "chore(post-merge): aggiorna registry ($PR_NUMBER)" \
              --body "Registry artifacts updated after pipeline run." \
              --add-label post-merge
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(post-merge): aggiorna registry ($PR_NUMBER)" \
              --body "Registry artifacts updated after pipeline run." \
              --label post-merge \
              --draft
          fi
