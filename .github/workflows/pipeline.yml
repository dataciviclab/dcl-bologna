# Pipeline — dcl-bologna
#
# Run post-merge + schedule. Fa tutto:
#   1. bootstrap varchi-ztl (fetch 80 varchi + merge) con cache persistente
#   2. run dei dataset (cambiati se PR merged, TUTTI se schedule/manuale)
#   3. sync GCS (clean + mart) — GRACEFUL: skippata se le chiavi non ci sono
#   4. build_registry --write → PR draft se diff (pattern eurostat/DI)
#
# Triggers:
#   - pull_request closed (merged) su datasets/** → run dei dataset cambiati
#   - schedule mensile (1° del mese 06:00 UTC) → run completo (refresh dati)
#   - workflow_dispatch → manuale, slug opzionale

name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
      - "scripts/**"
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      datasets:
        description: "Dataset slugs (comma-separated) o vuoto per tutti"
        required: false
        type: string
      smoke:
        description: "Smoke mode (--sample-rows 1000, skips GCS sync)"
        required: false
        default: false
        type: boolean

concurrency:
  group: dcl-bologna-pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

env:
  TOOLKIT_ALLOW_SCRIPT_SOURCE: "1"

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolkit
        run: |
          pip install git+https://github.com/dataciviclab/toolkit.git
          pip install git+https://github.com/dataciviclab/lab-connectors.git

      # ── Bootstrap varchi-ztl (una tantum per run) ──────────────────
      # I 80 varchi raw stanno in una cache persistente (actions/cache):
      # al primo run si scaricano (~20-25 min), ai successivi solo il merge.
      - name: Cache varchi raw
        uses: actions/cache@v4
        with:
          path: datasets/varchi-ztl/cache/
          key: varchi-cache-${{ hashFiles('catalogo/**') }}
          restore-keys: |
            varchi-cache-

      - name: Bootstrap varchi-ztl
        run: |
          python datasets/varchi-ztl/fetch_varchi_toolkit.py --fetch || true

      # ── Determinare i dataset da processare ─────────────────────────
      - name: Detect datasets to run
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_DATASETS: ${{ inputs.datasets }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # PR merged: solo i dataset cambiati
            gh pr view "$PR_NUMBER" --json files --jq ".files[].path" | \
              grep '^datasets/' | cut -d/ -f2 | sort -u > dirs.txt
          elif [ -n "$INPUT_DATASETS" ]; then
            echo "$INPUT_DATASETS" | tr ',' '\n' | sed 's/_/-/g' > dirs.txt
          else
            # Schedule/manuale senza slug: tutti
            find datasets -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort > dirs.txt
          fi
          DIRS=""
          while read -r d; do
            [ -n "$d" ] && [ -f "datasets/$d/dataset.yml" ] && DIRS="$DIRS datasets/$d"
          done < dirs.txt
          if [ -n "$DIRS" ]; then
            echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          else
            echo "dirs=" >> "$GITHUB_OUTPUT"
          fi

      # ── Run pipeline ─────────────────────────────────────────────────
      - name: Run datasets
        if: steps.detect.outputs.dirs != ''
        env:
          SMOKE: ${{ inputs.smoke && '--sample-rows 1000' || '' }}
        run: |
          YEAR=$(date +%Y)
          for dir in ${{ steps.detect.outputs.dirs }}; do
            echo "=== $dir ==="
            toolkit run -c "$dir/dataset.yml" --years $YEAR $SMOKE
          done

      # ── Sync GCS (graceful: skippa se le chiavi non sono configurate) ──
      - name: Sync GCS (clean+mart)
        if: ${{ !inputs.smoke }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_DCL_BOLOGNA }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "⚠️ GCP_SA_KEY_DCL_BOLOGNA non configurata — skip GCS sync"
            exit 0
          fi
          echo "$GCP_SA_KEY" | gcloud auth activate-service-account --key-file=- 2>/dev/null || {
            echo "⚠️ auth GCS fallita (tooling) — skip"
            exit 0
          }
          echo "GCS sync da implementare quando pubblicazione attiva"

      # ── Registry + PR draft ─────────────────────────────────────────
      - name: Build registry
        run: |
          python scripts/build_registry.py --write 2>/dev/null || echo "⚠️ build_registry non ancora presente"

      - name: Open PR if registry changed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet registry/; then
            echo "registry invariato"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add registry/
            git commit -m "chore(post-merge): aggiorna registry" || true
            git push origin HEAD:main || true
          fi
