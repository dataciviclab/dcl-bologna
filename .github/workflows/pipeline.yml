# Pipeline — dcl-bologna
#
# Post-merge + schedule. Struttura semplificata:
#   1. detect dataset cambiati (PR) o tutti (schedule/dispatch)
#   2. bootstrap varchi-ztl se necessario
#   3. toolkit run via make run-batch
#   4. GCS sync + registry PR (composite action condivise)

name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      datasets:
        description: "Dataset slugs (comma-separated) o vuoto per tutti"
        required: false
        type: string

concurrency:
  group: dcl-bologna-pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      - uses: dataciviclab/.github/actions/python-setup@main

      # ── Detect + batch ──────────────────────────────────────────────
      - name: Detect datasets
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATASETS: ${{ inputs.datasets }}
        run: |
          : > batch.txt

          if [ -n "$INPUT_DATASETS" ]; then
            # Manual dispatch con slug specifici
            echo "$INPUT_DATASETS" | tr ',' '\n' | sed 's/_/-/g' > dirs.txt
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR merged: usa detect-changed-datasets pattern
            PR_NUMBER="${{ github.event.pull_request.number }}"
            gh pr view "$PR_NUMBER" --json files --jq '.files[].path' | \
              grep '^datasets/' | cut -d/ -f2 | sort -u > dirs.txt
          else
            # Schedule o dispatch senza slug: tutti
            find datasets -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort > dirs.txt
          fi

          # Filtra solo dir con dataset.yml, escludi varchi-ztl dal batch
          DIRS=""
          while read -r d; do
            [ -z "$d" ] && continue
            [ -f "datasets/$d/dataset.yml" ] || continue
            DIRS="$DIRS $d"
            [ "$d" != "varchi-ztl" ] && echo "datasets/$d/dataset.yml" >> batch.txt || true
          done < dirs.txt
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          echo "dirs=$DIRS"

      # ── Bootstrap varchi-ztl ────────────────────────────────────────
      - name: Cache varchi raw
        if: contains(steps.detect.outputs.dirs, 'varchi-ztl')
        uses: actions/cache@v4
        with:
          path: datasets/varchi-ztl/cache/
          key: varchi-cache-${{ hashFiles('datasets/varchi-ztl/fetch_varchi_toolkit.py') }}
          restore-keys: |
            varchi-cache-

      - name: Bootstrap varchi-ztl
        if: contains(steps.detect.outputs.dirs, 'varchi-ztl')
        run: python datasets/varchi-ztl/fetch_varchi_toolkit.py --fetch

      # ── Run ─────────────────────────────────────────────────────────
      - name: Run datasets
        run: |
          if [ -s batch.txt ]; then
            toolkit run --batch batch.txt
          else
            echo "Nessun dataset da processare"
          fi

      # ── GCS sync + registry (composite condivise) ───────────────────
      - name: GCS Auth
        uses: dataciviclab/.github/actions/gcs-auth@main
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_DCL_BOLOGNA }}

      - name: Sync to GCS
        if: steps.gcs.outputs.ready == 'true'
        run: |
          gsutil -m rsync -r out/data/mart/ gs://dataciviclab-mart/bologna/
          gsutil -m rsync -r out/data/clean/ gs://dataciviclab-clean/bologna/
          echo "✅ Synced to gs://dataciviclab-mart|clean/bologna/"

      - name: Registry update PR
        uses: dataciviclab/.github/actions/registry-update-pr@main
        with:
          prefix: bologna
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
