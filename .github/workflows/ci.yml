# CI — dcl-bologna
# Validazione leggera su PR/push: config dataset validi via toolkit preflight.
# varchi-ztl è escluso: usa local_file su un mergiato generato dal bootstrap
# (fetch_varchi_toolkit.py), non disponibile su PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-config:
    uses: dataciviclab/.github/.github/workflows/dataset-config-check-reusable.yml@main
    with:
      install: "pip install -r requirements.txt"
      globs: "datasets"
      years: "from-config"
      exclude: "varchi-ztl"
