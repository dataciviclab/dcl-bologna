# CI — dcl-bologna
# Validazione leggera su PR/push: config dataset validi + smoke test dashboard.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.detect.outputs.dirs }}
      found: ${{ steps.detect.outputs.found }}
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/detect-changed-datasets@main
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          paths: "datasets"

  validate-config:
    needs: detect
    if: always() && (github.event_name != 'pull_request' || needs.detect.outputs.found == 'true')
    uses: dataciviclab/.github/.github/workflows/dataset-config-check-reusable.yml@main
    with:
      globs: "datasets"  # fallback su push: scan completo
      configs: ${{ needs.detect.outputs.dirs }}
      years: "from-config"
      exclude: "varchi-ztl"

  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-requirements: dashboard/requirements.txt
          extra-packages: pytest
      - run: pytest dashboard/tests/ -q
