# CI — dcl-bologna
# Validazione leggera su PR/push: config dataset validi + smoke test dashboard.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-config:
    uses: dataciviclab/.github/.github/workflows/dataset-config-check-reusable.yml@main
    with:
      install: "pip install -r requirements.txt"
      globs: "datasets"
      years: "from-config"
      exclude: "varchi-ztl"

  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-requirements: dashboard/requirements.txt
          extra-packages: pytest
      - run: pytest dashboard/tests/ -q
